name: Build & Publish Android Release

on:
  push:
    branches:
      - main
      - staging
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # =========================================================
  # JOB 1 — Build & Publish APK
  # =========================================================
  create-release:
    name: Compile and Release Android App
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Install Project Dependencies
        run: npm ci --legacy-peer-deps

      # =========================================================
      # ENVIRONMENT CONFIGURATION
      # =========================================================
      - name: Create .env file
        env:
          API_URL: ${{ secrets.API_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: |
          {
            printf 'API_URL=%s\n' "$API_URL"
            printf 'FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY"
            printf 'POSTHOG_API_KEY=%s\n' "$POSTHOG_API_KEY"
            printf 'POSTHOG_HOST=%s\n' "$POSTHOG_HOST"
          } > .env

          echo ".env file generated successfully."

          if [ -z "$POSTHOG_API_KEY" ]; then
            echo "::error::POSTHOG_API_KEY is missing."
            exit 1
          fi

          if [ -z "$POSTHOG_HOST" ]; then
            echo "::error::POSTHOG_HOST is missing."
            exit 1
          fi

      # =========================================================
      # RELEASE VERSION
      # =========================================================
      - name: Determine Release Tag
        id: version_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          fi

          echo "TAG=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      # =========================================================
      # ANDROID BUILD
      # =========================================================
      - name: Compile Production Release APK
        working-directory: android
        env:
          JAVA_OPTS: "-Xmx4g"
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=4 -Dorg.gradle.parallel=true"
        run: |
          chmod +x ./gradlew

          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            --no-daemon \
            --stacktrace

      - name: Verify APK was produced
        run: |
          ls -lh android/app/build/outputs/apk/release/

          test -f android/app/build/outputs/apk/release/app-release.apk \
            || { echo "APK not found!"; exit 1; }

      # =========================================================
      # APK NAMING
      # =========================================================
      - name: Rename APK with Title and Tag
        id: apk_name
        run: |
          TITLE="${{ vars.APP_TITLE }}"
          TITLE="${TITLE:-MyApp}"

          TAG="${{ steps.version_tag.outputs.TAG }}"
          TAG_SAFE="${TAG//\//-}"

          NEW_NAME="${TITLE}-${TAG_SAFE}.apk"

          SRC="android/app/build/outputs/apk/release/app-release.apk"
          DEST="android/app/build/outputs/apk/release/${NEW_NAME}"

          mv "$SRC" "$DEST"

          echo "APK_PATH=${DEST}" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=${NEW_NAME}" >> "$GITHUB_OUTPUT"

          echo "Renamed APK to: ${NEW_NAME}"
          ls -lh android/app/build/outputs/apk/release/

      # =========================================================
      # COMMIT INFORMATION
      # =========================================================
      - name: Resolve commit title and description
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          FULL: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ -z "$FULL" ]; then
            FULL=$(git log -1 --pretty=%B)
            AUTHOR=$(git log -1 --pretty=%an)
          fi

          TITLE=$(printf '%s\n' "$FULL" | head -n1)
          BODY=$(printf '%s\n' "$FULL" | awk 'BEGIN{b=0} /^$/{b=1; next} b{print}')

          if printf '%s' "$TITLE" | grep -q '^Merge pull request'; then
            PR_JSON=$(gh api "repos/$REPO/commits/$SHA/pulls" 2>/dev/null || echo "[]")
            PR_COUNT=$(echo "$PR_JSON" | jq 'length')

            if [ "$PR_COUNT" -gt 0 ]; then
              PR_TITLE=$(echo "$PR_JSON" | jq -r '.[0].title')
              PR_BODY=$(echo "$PR_JSON" | jq -r '.[0].body // ""')
              PR_NUM=$(echo "$PR_JSON" | jq -r '.[0].number')
              PR_URL=$(echo "$PR_JSON" | jq -r '.[0].html_url')

              [ -n "$PR_TITLE" ] && TITLE="$PR_TITLE"
              [ -n "$PR_BODY" ] && BODY="$PR_BODY"

              echo "pr_number=$PR_NUM" >> "$GITHUB_OUTPUT"
              echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
            fi
          fi

          [ -z "$TITLE" ] && TITLE="(no title)"
          [ -z "$BODY" ] && BODY="(no description)"
          [ -z "$AUTHOR" ] && AUTHOR="(unknown)"

          # Keep description bounded so total Discord message stays well under 2000 chars
          MAX_LEN=1000
          if [ "${#BODY}" -gt "$MAX_LEN" ]; then
            DISCORD_BODY="${BODY:0:$MAX_LEN}… *(truncated, see GitHub release/PR)*"
          else
            DISCORD_BODY="$BODY"
          fi

          {
            echo "title<<EOF"
            echo "$TITLE"
            echo "EOF"

            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"

            echo "discord_body<<EOF"
            echo "$DISCORD_BODY"
            echo "EOF"

            echo "author<<EOF"
            echo "$AUTHOR"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # =========================================================
      # GITHUB RELEASE
      # =========================================================
      - name: Create GitHub Release and Upload APK
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version_tag.outputs.TAG }}
          name: Release ${{ steps.version_tag.outputs.TAG }}
          body: |
            ### Automated Project Build

            - **Compiled on:** ${{ steps.version_tag.outputs.DATE }}
            - **Branch:** `${{ github.ref_name }}`
            - **Commit SHA:** `${{ github.sha }}`
            - **Architectures:** `armeabi-v7a`, `arm64-v8a`
            - **Build flags:** 4 GB heap, 4 workers, parallel, R8+shrinkResources

            ---
            *Download `${{ steps.apk_name.outputs.APK_NAME }}` below to test the newest changes.*

          artifacts: ${{ steps.apk_name.outputs.APK_PATH }}
          allowUpdates: true
          generateReleaseNotes: true
          draft: false
          prerelease: ${{ github.ref_name == 'staging' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================
      # DISCORD RELEASE NOTIFICATION
      # =========================================================
      - name: Send Discord Notification (Release Ready)
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            **@here New Android release is ready**
            **App**: `${{ github.repository }}`
            **Release**: `${{ steps.version_tag.outputs.TAG }}`
            **Branch**: `${{ github.ref_name }}`
            **Commit**: `${{ github.sha }}`
            **Author**: `${{ steps.commit.outputs.author }}`
            **Title**: ${{ steps.commit.outputs.title }}

            **Description**:
            ${{ steps.commit.outputs.discord_body }}

            **Download APK**: ${{ steps.create_release.outputs.html_url }}

      # =========================================================
      # DISCORD FAILURE NOTIFICATION
      # =========================================================
      - name: Notify Discord on failure
        if: failure()
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            **@here Android build FAILED**
            **App**: `${{ github.repository }}`
            **Branch**: `${{ github.ref_name }}`
            **Commit**: `${{ github.sha }}`