name: Discord Push Notification

on:
  push:
    branches:
      - main

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -fsS -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg repo "${{ github.repository }}" \
              --arg actor "${{ github.actor }}" \
              --arg branch "${{ github.ref_name }}" \
              --arg sha "${{ github.sha }}" \
              --arg msg "${{ github.event.head_commit.message }}" \
              --arg author "${{ github.event.head_commit.author.name }}" \
              --arg tree "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}" \
              --arg commit "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
              '{content: ("**@here stay alert because there is a deployment to main**\n**New push to `" + $repo + "`**\n**Pusher**: `" + $actor + "`\n**Branch**: `" + $branch + "`\n**Commit**: `" + $sha + "`\n**Message**: `" + $msg + "`\n**Repo**: [" + $repo + "](" + $tree + ")\n**Author**: `" + $author + "`\n\n[View Commit](" + $commit + ")")}')"
