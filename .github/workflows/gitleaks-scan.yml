name: gitleaks automatic scanner (Every Day 6am/pm UTC)
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6,18 * * *"

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3   # ← v3, not v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ← correct name